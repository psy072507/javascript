<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>

    <h1>Simple Calculator</h1>
    <table>
        <tr>
            <td>
                <label for="num1">First Number:</label>
            </td>
            <td><input type="number" id="num1" placeholder="Enter first number"></td>
        </tr>
        <tr>
            <td>
                 <label for="num2">Second Number:</label>
            </td>
            <td><input type="number" id="num2" placeholder="Enter second number"></td>
        </tr>
        </tr>

    <br><br>

    <button onclick="calculateSum()">Sum</button>
    <button onclick="calculateDifference()">Difference</button>
    <button onclick="calculateProduct()">Product</button>
    <button onclick="calculateQuotient()">Quotient</button>
    <button onclick="clearEntries()">Clear</button>

    <h2>Result: <span id="result"></span></h2>

    <script src=”script.js”></script>

</body>
</html>
